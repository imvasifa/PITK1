services:
  - type: web
    name: pitk1
    env: python
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel
      python -m pip install --no-cache-dir -r requirements.txt
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker app3:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: FLASK_APP
        value: app3.py
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: true
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        fromDatabase:
          name: pitk1-db
          property: connectionString
    plan: free
    numInstances: 1
    healthCheckPath: /
    autoDeploy: true
