services:
  - type: web
    name: pitk1
    env: python
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn app3:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: true
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        fromDatabase:
          name: pitk1-db
          property: connectionString
    plan: free
    numInstances: 1
    healthCheckPath: /
    autoDeploy: true
