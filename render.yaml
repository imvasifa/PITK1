services:
  - type: web
    name: strong-stock-scanner
    env: python
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --only-binary :all: --prefer-binary -r requirements.txt
    startCommand: gunicorn app3:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_APP
        value: app3.py
      - key: PYTHONUNBUFFERED
        value: 1
    plan: free
    python:
      version: 3.12.3
