services:
  - type: web
    name: pitk1
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app3:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_APP
        value: app3.py
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pitk1-db
          property: connectionString
    plan: free
    numInstances: 1
