services:
  - type: web
    name: pitk1
    env: docker
    dockerContext: .
    dockerfile: Dockerfile
    dockerCommand: |
      docker build --build-arg PYTHON_VERSION=3.10 -t pitk1 .
      docker run -p 10000:5000 -e PORT=5000 pitk1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: FLASK_APP
        value: app3.py
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: PYTHON_VERSION
        value: "3.10"
    plan: free
    numInstances: 1
    healthCheckPath: /
    autoDeploy: true
