services:
  - type: web
    name: strong-stock-scanner
    env: python
    buildCommand: |
      python -m pip install --upgrade pip
      pip install setuptools==59.8.0 wheel==0.37.1
      pip install -e .
    startCommand: gunicorn app3:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app3.py
      - key: PYTHONUNBUFFERED
        value: 1
    plan: free
