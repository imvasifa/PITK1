<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PRICE IS THE KING - Monitor and manage your Chartink scans collectively">
    <title>PRICE IS THE KING - Market Intelligence Platform</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/pitk-logo.svg">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Hero Section */
        .hero {
            min-height: 90vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #1a2530 100%);
            color: white;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 100px 0;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
        }
        
        .logo-container {
            margin-bottom: 2rem;
        }
        
        .logo {
            max-width: 300px;
            height: auto;
            margin: 0 auto;
            display: block;
        }
        
        .tagline {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 2rem 0;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .subtagline {
            font-size: 1.25rem;
            max-width: 700px;
            margin: 0 auto 3rem;
            opacity: 0.9;
        }
        
        .cta-button {
            display: inline-block;
            background-color: var(--secondary-color);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 10px 15px;
        }
        
        .cta-button:hover {
            background-color: transparent;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .cta-button.secondary {
            background-color: transparent;
            border-color: white;
        }
        
        .cta-button.secondary:hover {
            background-color: white;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="logo-container">
                    <img src="assets/images/pitk-logo.svg" alt="PITK Logo" class="logo">
                </div>
                <h1 class="tagline">PRICE IS THE KING</h1>
                <p class="subtagline">Monitor and manage your Chartink scans collectively</p>
                <div class="cta-buttons">
                    <a href="https://pitk1-1.onrender.com/" target="_blank" rel="noopener noreferrer" class="cta-button">Get Started</a>
                    <a href="help.html" class="cta-button secondary">Learn More</a>
                </div>
            </div>
        </div>
        <!-- Animated background elements -->
        <div class="position-absolute top-0 end-0 w-100 h-100" style="z-index: 1; opacity: 0.1;">
            <div class="position-absolute" style="top: 20%; left: 10%; width: 300px; height: 300px; background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);"></div>
            <div class="position-absolute" style="bottom: 10%; right: 10%; width: 400px; height: 400px; background: radial-gradient(circle, var(--secondary-color) 0%, transparent 70%);"></div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
