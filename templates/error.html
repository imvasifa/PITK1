<!DOCTYPE html>
<html>
<head>
    <title>Error {{ error_code }} - {{ error_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            padding: 50px 20px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .error-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 10px;
        }
        .error-name {
            font-size: 2rem;
            color: #343a40;
            margin-bottom: 20px;
        }
        .error-description {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 30px;
        }
        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container">
            <div class="error-code">{{ error_code }}</div>
            <div class="error-name">{{ error_name }}</div>
            <div class="error-description">
                {{ error_description }}
            </div>
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg btn-home">
                <i class="fas fa-home me-2"></i>Return to Home
            </a>
        </div>
    </div>
</body>
</html>
