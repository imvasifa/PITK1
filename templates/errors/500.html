<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2 text-center">
                <h1 class="display-1 text-danger">500</h1>
                <h2>Internal Server Error</h2>
                <p class="lead">Oops! Something went wrong on our end.</p>
                <p>We're working to fix the issue. Please try again later or contact support if the problem persists.</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">
                    <i class="fas fa-home"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
