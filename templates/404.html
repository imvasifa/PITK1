{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Page Not Found (404)</h4>
                </div>
                <div class="card-body">
                    <p class="lead">The page you are looking for does not exist or has been moved.</p>
                    <p>You can try to <a href="{{ url_for('main.index') }}">return to the homepage</a> or use the navigation above.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
